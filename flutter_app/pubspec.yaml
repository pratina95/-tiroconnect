name: tiroconnect
description: Botswana's digital marketplace for blue-collar workers and skilled tradespeople
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  get_it: ^9.2.1

  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.0.0

  http: ^1.2.0
  dio: ^5.4.0

  cached_network_image: ^3.3.0
  intl: ^0.20.2

  shared_preferences: ^2.2.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.2.0
  permission_handler: ^12.0.3

  # Routing and utilities
  go_router: ^17.3.0
  firebase_messaging: ^15.2.0
  json_annotation: ^4.9.0
  injectable: ^3.0.0
  retrofit: ^4.9.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  injectable_generator: ^3.0.0
  retrofit_generator: ^10.2.7
